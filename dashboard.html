<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Task Management</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="box">

    <h1>Task Dashboard</h1>

    <input
    type="text"
    id="taskInput"
    placeholder="Enter Task">

    <input
    type="date"
    id="dateInput">

    <button
    class="btn"
    onclick="addTask()">

        Add Task

    </button>

    <br><br>

    <ul id="taskList">

    </ul>

    <br>


    <a href="login.html">

        <button class="btn">

            Logout

        </button>

    </a>

</div>

<script src="script.js"></script>

</body>
</html>
